<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#072a2c">
<title>Tekula</title>
<link rel="stylesheet" href="../assets/site.css">
<script src="../assets/site.js" data-root="../" data-page="game"></script>
<style>
/* Tekula: wolves, doctor and civilians, for the Asefa Family Gathering.
   One phone. Roles are dealt in secret, then the narrator runs the nights and days from it. */
:root {
  --bg: #072a2c;
  --bg-2: #0d3b3c;
  --card: #114846;
  --ink: #f4efe2;
  --ink-dim: rgba(244, 239, 226, .66);
  --line: rgba(244, 239, 226, .16);
  --gold: #f6c453;
  --moon: #f6e7b8;
  --wolf: #d23a2c;
  --doctor: #1b9aa0;
  --civil: #f6c453;
  --detective: #c43d86;
  --display: "Fraunces", Georgia, serif;
  --body: "Source Serif 4", Georgia, serif;
  --ethiopic: "Noto Serif Ethiopic", "Kefa", serif;
  color-scheme: dark;
}
body.day {
  --bg: #0e5245;
  --bg-2: #135f50;
  --card: #176b5a;
  --gold: #f6c453;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  background-image: radial-gradient(70% 45% at 80% 0%, rgba(246, 231, 184, .16) 0%, transparent 60%), linear-gradient(180deg, #0b3a3c 0%, #072a2c 60%, #041c1e 100%);
  background-attachment: fixed;
  color: var(--ink); font-family: var(--body);
  -webkit-tap-highlight-color: transparent;
  transition: background-color .5s;
}
body.day { background-image: radial-gradient(80% 50% at 50% 0%, rgba(246, 196, 83, .3) 0%, transparent 65%), linear-gradient(180deg, #0e5245 0%, #0b3d33 100%); }
.ribbon { position: fixed; top: 0; left: 0; right: 0; z-index: 12; }
.back { align-self: flex-start; color: var(--gold); text-decoration: none; font-weight: 600; font-size: .95rem; }
.back:hover { text-decoration: underline; }
html[lang="am"] body, [lang="am"] { font-family: var(--ethiopic); }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .4; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
[hidden] { display: none !important; }

#app {
  min-height: 100%; max-width: 44rem; margin: 0 auto;
  padding: calc(30px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 18px;
}

/* ---------- common pieces */
.brand h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(3rem, 12vw, 4.4rem); line-height: .9; letter-spacing: -.02em; font-variation-settings: "opsz" 144; }
.brand .alt { color: var(--gold); margin-top: 6px; }
.tagline { font-family: var(--display); font-size: 1.25rem; line-height: 1.35; margin: 0; text-wrap: balance; }
html[lang="am"] .tagline { font-family: var(--ethiopic); font-size: 1.15rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 4px; flex-wrap: wrap; align-self: flex-start; }
.seg button { border: 0; background: transparent; padding: 8px 16px; border-radius: 999px; color: var(--ink-dim); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }
.panel { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 10px; }
.label { font-size: .78rem; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin: 0; font-weight: 600; }
html[lang="am"] .label { letter-spacing: .04em; font-size: .9rem; }
.hint { color: var(--ink-dim); font-size: .95rem; margin: 0; line-height: 1.45; }
.warn { color: #ffb4a6; }
.btn { border: 0; border-radius: 14px; padding: 12px 18px; font-weight: 600; font-size: 1.05rem; background: var(--ink); color: var(--bg); }
.btn.big { width: 100%; padding: 17px; font-size: 1.25rem; border-radius: 18px; font-family: var(--display); }
html[lang="am"] .btn.big { font-family: var(--ethiopic); }
.btn.accent { background: var(--gold); color: #1b1408; }
.btn.danger { background: var(--wolf); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.link { border: 0; background: none; color: var(--ink-dim); text-decoration: underline; text-underline-offset: 4px; padding: 8px; font-size: 1rem; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

.add { display: flex; gap: 8px; }
.add input { flex: 1; min-width: 0; font: inherit; font-size: 1.1rem; color: var(--ink); background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.add input::placeholder { color: var(--ink-dim); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0; list-style: none; }
.chips li { display: inline-flex; align-items: center; gap: 6px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 14px; }
.chips button { border: 0; background: rgba(244, 239, 226, .1); width: 28px; height: 28px; border-radius: 50%; line-height: 1; }

.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.setting:last-child { border-bottom: 0; }
.setting .name { display: flex; align-items: center; gap: 10px; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper button { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); font-size: 1.3rem; line-height: 1; }
.stepper output { min-width: 2.2ch; text-align: center; font-family: var(--display); font-size: 1.5rem; font-weight: 700; }
.switch { width: 54px; height: 32px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg-2); position: relative; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--ink-dim); transition: transform .2s, background .2s; }
.switch[aria-checked="true"] { background: var(--gold); border-color: var(--gold); }
.switch[aria-checked="true"]::after { transform: translateX(22px); background: #1b1408; }
.mix { display: flex; flex-wrap: wrap; gap: 8px; }
.mix span { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 6px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--line); font-size: .95rem; }
ol.how { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 10px; }
ol.how li { counter-increment: s; display: grid; grid-template-columns: 2rem 1fr; gap: 8px; line-height: 1.45; }
ol.how li::before { content: counter(s); font-family: var(--display); font-weight: 700; font-size: 1.3rem; color: var(--gold); line-height: 1.1; }

/* role icons */
.ico { width: 30px; height: 30px; flex: none; display: inline-block; }
.ico.lg { width: 132px; height: 132px; }
.ico svg { width: 100%; height: 100%; display: block; }

/* ---------- dealing */
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; }
.passname { font-family: var(--display); font-weight: 700; font-size: clamp(2.6rem, 12vw, 4rem); line-height: 1; }
html[lang="am"] .passname { font-family: var(--display); }
.progress { color: var(--ink-dim); font-size: .95rem; }
.rolecard { width: 100%; max-width: 26rem; border-radius: 26px; padding: 28px 22px; background: var(--card); border: 2px solid var(--rc, var(--gold)); display: grid; justify-items: center; gap: 12px; box-shadow: 0 20px 50px -20px rgba(0, 0, 0, .7); }
.rolecard .rname { font-family: var(--display); font-weight: 700; font-size: 2.6rem; line-height: 1; color: var(--rc, var(--gold)); }
html[lang="am"] .rolecard .rname { font-family: var(--ethiopic); font-size: 2.3rem; }
.rolecard p { margin: 0; line-height: 1.5; font-size: 1.05rem; }
.rolecard .mates { color: var(--ink); font-weight: 600; }

/* ---------- narrator */
.topbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.phase { font-family: var(--display); font-weight: 700; font-size: 1.4rem; display: inline-flex; align-items: center; gap: 8px; }
html[lang="am"] .phase { font-family: var(--ethiopic); }
.mini { border: 1px solid var(--line); background: transparent; color: var(--ink-dim); border-radius: 999px; padding: 6px 12px; font-size: .88rem; }
.mini[aria-pressed="true"] { color: var(--bg); background: var(--gold); border-color: var(--gold); }
.read { border-radius: 22px; padding: 22px; background: var(--card); border: 1px solid var(--line); }
.read .label { margin-bottom: 8px; }
.read .say { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(1.5rem, 6.5vw, 2.1rem); line-height: 1.25; text-wrap: balance; }
html[lang="am"] .read .say { font-family: var(--ethiopic); font-size: clamp(1.35rem, 6vw, 1.85rem); line-height: 1.5; }
.note { border-left: 3px solid var(--gold); padding: 4px 0 4px 12px; color: var(--ink); line-height: 1.45; }
.note .label { margin-bottom: 4px; }
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: 8px; }
.pick button { text-align: left; border: 1px solid var(--line); background: var(--bg-2); border-radius: 14px; padding: 12px 14px; font-size: 1.08rem; display: flex; align-items: center; gap: 8px; min-height: 52px; }
.pick button[aria-pressed="true"] { border-color: var(--gold); background: rgba(233, 185, 90, .18); box-shadow: inset 0 0 0 1px var(--gold); }
.pick .tag { margin-left: auto; font-size: .78rem; color: var(--ink-dim); }
.answer { border-radius: 22px; padding: 26px 20px; text-align: center; font-family: var(--display); font-weight: 700; font-size: clamp(2rem, 9vw, 3rem); line-height: 1.1; }
html[lang="am"] .answer { font-family: var(--ethiopic); }
.answer.yes { background: var(--wolf); color: #fff; }
.answer.no { background: var(--doctor); color: #fff; }
.answer small { display: block; font-size: .45em; font-weight: 600; margin-top: 10px; opacity: .92; }
.timer { font-family: var(--display); font-weight: 700; font-size: clamp(4rem, 22vw, 7rem); text-align: center; line-height: 1; font-variant-numeric: tabular-nums; }
.timer.done { color: var(--wolf); }
.status { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 0; list-style: none; }
.status li { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; padding: 4px 10px 4px 5px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--line); }
.status li.out { opacity: .4; text-decoration: line-through; }
.status .ico { width: 22px; height: 22px; }
.reveal { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; background: var(--bg-2); border: 1px solid var(--line); }
.reveal .ico { width: 54px; height: 54px; }
.reveal b { font-family: var(--display); font-size: 1.3rem; }
html[lang="am"] .reveal b { font-family: var(--ethiopic); }
.win { text-align: center; font-family: var(--display); font-weight: 700; font-size: clamp(2.2rem, 10vw, 3.4rem); line-height: 1.05; }
html[lang="am"] .win { font-family: var(--ethiopic); }
.roles-list { display: grid; gap: 8px; }
.roles-list div { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: var(--bg-2); }
.roles-list .out { opacity: .55; }
.foot { display: grid; gap: 10px; margin-top: auto; }
</style>
</head>

var app = document.getElementById('app');
function render() {
  document.documentElement.lang = lang;
  stopTimer(false);
  var night = G && G.phase === 'night';
  var day = G && (G.phase === 'morning' || G.phase === 'discuss' || G.phase === 'vote' || G.phase === 'voted');
  document.body.classList.toggle('day', !!day);
  if (offerResume) return renderResume();
  if (!G || G.phase === 'setup') return renderSetup();
  if (G.phase === 'deal') return renderDeal();
  if (G.phase === 'dealt') return renderDealt();
  if (night) return renderNight();
  if (G.phase === 'morning') return renderMorning();
  if (G.phase === 'discuss') return renderDiscuss();
  if (G.phase === 'vote') return renderVote();
  if (G.phase === 'voted') return renderVoted();
  if (G.phase === 'over') return renderOver();
}
function on(sel, ev, fn) { var el = app.querySelector(sel); if (el) el.addEventListener(ev, fn); }
function onAll(sel, ev, fn) { app.querySelectorAll(sel).forEach(function (el) { el.addEventListener(ev, function () { fn(el); }); }); }

function langSeg() {
  return '<div class="seg" role="group" aria-label="Language">' + ['en', 'am', 'om'].map(function (l) {
    return '<button type="button" data-lang="' + l + '" lang="' + l + '" aria-pressed="' + (l === lang) + '">' + LANG_NAME[l] + '</button>';
  }).join('') + '</div>';
}
function wireLang() { onAll('.seg button', 'click', function (b) { lang = b.dataset.lang; keep('lang', lang); render(); }); }

/* ---------- resume */
function renderResume() {
  app.innerHTML =
    '<a class="back" href="./">← <span class="t" lang="en">Family games</span><span class="t" lang="am">የቤተሰብ ጨዋታዎች</span><span class="t" lang="om">Taphoota maatii</span></a>' +
    '<div class="brand"><h1><span class="t" lang="en">Tekula!</span><span class="t" lang="am">ተኩላ!</span><span class="t" lang="om">Yeeyyii!</span></h1></div>' +
    '<div class="center"><p class="tagline">' + esc(t('resume')) + '</p></div>' +
    '<div class="foot"><button class="btn big accent" id="yes">' + esc(t('resumeYes')) + '</button><button class="btn big ghost" id="no">' + esc(t('resumeNo')) + '</button></div>';
  on('#yes', 'click', function () { G = saved; if (G.phase === 'deal') G.dealShown = false; offerResume = false; save(); render(); });
  on('#no', 'click', function () { drop('game'); offerResume = false; G = null; render(); });
}

/* ---------- setup */
function renderSetup() {
  fixWolves();
  var n = setup.names.length, mw = maxWolves(Math.max(n, 3));
  var civ = Math.max(0, n - setup.wolves - (setup.doctor ? 1 : 0) - (setup.detective ? 1 : 0));
  var chips = setup.names.map(function (nm, i) { return '<li><span>' + esc(nm) + '</span><button type="button" data-i="' + i + '" aria-label="Remove ' + esc(nm) + '">×</button></li>'; }).join('');
  app.innerHTML =
    '<a class="back" href="./">← <span class="t" lang="en">Family games</span><span class="t" lang="am">የቤተሰብ ጨዋታዎች</span><span class="t" lang="om">Taphoota maatii</span></a>' +
    '<div class="brand"><h1><span class="t" lang="en">Tekula!</span><span class="t" lang="am">ተኩላ!</span><span class="t" lang="om">Yeeyyii!</span></h1></div>' +
    '<p class="tagline">' + esc(t('tagline')) + '</p>' +
    '<section class="panel"><h2 class="label">' + esc(t('players')) + ' · ' + n + '</h2>' +
      '<p class="hint">' + ico('moon') + ' ' + esc(t('narratorNote')) + '</p>' +
      '<form class="add" id="addForm"><input id="nameInput" type="text" autocomplete="off" maxlength="18" placeholder="' + esc(t('addName')) + '"><button class="btn" type="submit">' + esc(t('add')) + '</button></form>' +
      '<ul class="chips">' + chips + '</ul>' +
      (ui.setupMsg ? '<p class="hint warn">' + esc(ui.setupMsg) + '</p>' : '') +
    '</section>' +
    '<section class="panel"><h2 class="label">' + esc(t('roles')) + '</h2>' +
      '<div class="setting"><span class="name">' + ico('wolf') + esc(t('wolves')) + '</span><span class="stepper"><button type="button" id="wMinus" aria-label="−"' + (setup.wolves <= 1 ? ' disabled' : '') + '>−</button><output>' + setup.wolves + '</output><button type="button" id="wPlus" aria-label="+"' + (setup.wolves >= mw ? ' disabled' : '') + '>+</button></span></div>' +
      (n >= 5 ? '<p class="hint">' + esc(t('suggested')(n, suggestWolves(n))) + '</p>' : '') +
      '<div class="setting"><span class="name">' + ico('doctor') + esc(t('doctor')) + '</span><button type="button" class="switch" id="swDoc" role="switch" aria-checked="' + setup.doctor + '" aria-label="' + esc(t('doctor')) + '"></button></div>' +
      '<div class="setting"><span class="name">' + ico('detective') + esc(t('detectiveOpt')) + '</span><button type="button" class="switch" id="swDet" role="switch" aria-checked="' + setup.detective + '" aria-label="' + esc(t('detective')) + '"></button></div>' +
      '<div class="setting"><span class="name">' + esc(t('reveal')) + '</span><button type="button" class="switch" id="swRev" role="switch" aria-checked="' + setup.reveal + '" aria-label="' + esc(t('reveal')) + '"></button></div>' +
      (n >= 5 ? '<p class="label" style="margin-top:6px">' + esc(t('mix')) + '</p><div class="mix">' +
        '<span>' + ico('wolf') + setup.wolves + ' ' + esc(t('wolves')) + '</span>' +
        (setup.doctor ? '<span>' + ico('doctor') + '1 ' + esc(t('doctor')) + '</span>' : '') +
        (setup.detective ? '<span>' + ico('detective') + '1 ' + esc(t('detective')) + '</span>' : '') +
        '<span>' + ico('civilian') + civ + ' ' + esc(t('civilians')) + '</span></div>' : '') +
    '</section>' +
    '<section class="panel"><h2 class="label">' + esc(t('howTitle')) + '</h2><ol class="how">' + t('how').map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol></section>' +
    '<div class="foot"><button class="btn big accent" id="dealBtn">' + esc(t('deal')) + '</button></div>';
  on('#addForm', 'submit', function (e) {
    e.preventDefault();
    var v = document.getElementById('nameInput').value.trim();
    if (v && !setup.names.some(function (x) { return x.toLowerCase() === v.toLowerCase(); })) setup.names.push(v);
    ui.setupMsg = ''; keep('setup', setup); render();
    var inp = document.getElementById('nameInput'); if (inp) inp.focus();
  });
  onAll('.chips button', 'click', function (b) { setup.names.splice(+b.dataset.i, 1); keep('setup', setup); render(); });
  on('#wMinus', 'click', function () { setup.wolves--; setup.wolvesAuto = false; keep('setup', setup); render(); });
  on('#wPlus', 'click', function () { setup.wolves++; setup.wolvesAuto = false; keep('setup', setup); render(); });
  on('#swDoc', 'click', function () { setup.doctor = !setup.doctor; keep('setup', setup); render(); });
  on('#swDet', 'click', function () { setup.detective = !setup.detective; keep('setup', setup); render(); });
  on('#swRev', 'click', function () { setup.reveal = !setup.reveal; keep('setup', setup); render(); });
  on('#dealBtn', 'click', function () {
    if (setup.names.length < 5) { ui.setupMsg = t('minPlayers'); render(); return; }
    ui.setupMsg = ''; newGame(); render(); window.scrollTo(0, 0);
  });
}

/* ---------- dealing roles in secret */
function renderDeal() {
  var p = G.players[G.dealIdx];
  if (!G.dealShown) {
    app.innerHTML =
      '<div class="center">' +
        '<div class="progress">' + (G.dealIdx + 1) + ' / ' + G.players.length + '</div>' +
        '<div class="hint">' + esc(t('passTo')) + '</div>' +
        '<div class="passname">' + esc(p.name) + '</div>' +
        '<p class="hint">' + esc(t('privacy')) + '</p>' +
      '</div>' +
      '<div class="foot"><button class="btn big accent" id="show">' + esc(t('showRole')(p.name)) + '</button></div>';
    on('#show', 'click', function () { G.dealShown = true; save(); render(); });
    return;
  }
  var mates = '';
  if (p.role === 'wolf') {
    var others = G.players.filter(function (x) { return x.role === 'wolf' && x !== p; }).map(function (x) { return x.name; });
    mates = '<p class="mates">' + esc(others.length ? t('mates')(others.join(', ')) : t('lone')) + '</p>';
  }
  app.innerHTML =
    '<div class="center">' +
      '<div class="label">' + esc(p.name) + ' · ' + esc(t('yourRole')) + '</div>' +
      '<div class="rolecard" style="--rc:' + ROLE_COLOR[p.role] + '">' + ico(p.role, 'lg') +
        '<div class="rname">' + esc(roleName(p.role)) + '</div>' +
        '<p>' + esc(t('desc')[p.role]) + '</p>' + mates +
      '</div>' +
    '</div>' +
    '<div class="foot"><button class="btn big" id="hide">' + esc(t('hidePass')) + '</button></div>';
  on('#hide', 'click', function () {
    G.dealShown = false; G.dealIdx++;
    if (G.dealIdx >= G.players.length) G.phase = 'dealt';
    save(); render();
  });
}
function renderDealt() {
  app.innerHTML =
    '<div class="center">' + ico('moon', 'lg') + '<p class="tagline">' + esc(t('allSeen')) + '</p></div>' +
    '<div class="foot"><button class="btn big accent" id="go">' + esc(t('startNight')) + '</button>' +
    '<button class="link" id="redeal">' + esc(t('redeal')) + '</button></div>';
  on('#go', 'click', function () { G.phase = 'night'; G.step = 0; G.sub = 'wake'; G.picks = {}; save(); render(); });
  on('#redeal', 'click', function () { newGame(); render(); });
}

/* ---------- narrator chrome */
function topbar(label, icon) {
  var list = G.players.map(function (p) {
    return '<li class="' + (p.alive ? '' : 'out') + '">' + (ui.showRoles ? ico(p.role) : '') + '<span>' + esc(p.name) + '</span></li>';
  }).join('');
  return '<div class="topbar"><span class="phase">' + ico(icon) + esc(label) + '</span><span class="spacer"></span>' +
    '<button class="mini" id="rolesBtn" aria-pressed="' + ui.showRoles + '">' + esc(t('showRoles')) + '</button>' +
    '<button class="mini" id="endBtn">' + esc(ui.endArmed ? t('endConfirm') : t('endGame')) + '</button></div>' +
    '<ul class="status">' + list + '</ul>';
}
function wireTop() {
  on('#rolesBtn', 'click', function () { ui.showRoles = !ui.showRoles; render(); });
  on('#endBtn', 'click', function () {
    if (!ui.endArmed) { ui.endArmed = true; render(); setTimeout(function () { if (ui.endArmed) { ui.endArmed = false; render(); } }, 3000); return; }
    ui.endArmed = false; drop('game'); G = null; render();
  });
}
function readBlock(text) { return '<div class="read"><div class="label">' + esc(t('readAloud')) + '</div><p class="say">' + esc(text) + '</p></div>'; }
function noteBlock(text) { return '<div class="note"><div class="label">' + esc(t('forNarrator')) + '</div>' + esc(text) + '</div>'; }
function picker(list, extra) {
  return '<div class="pick">' + list.map(function (p) {
    var i = G.players.indexOf(p);
    return '<button type="button" data-i="' + i + '" aria-pressed="' + (ui.pick === i) + '">' + esc(p.name) + (ui.showRoles ? '<span class="tag">' + esc(roleName(p.role)) + '</span>' : '') + '</button>';
  }).join('') + (extra || '') + '</div>';
}
function wirePicker() {
  onAll('.pick button', 'click', function (b) {
    ui.pick = b.dataset.i === 'none' ? -1 : +b.dataset.i;
    app.querySelectorAll('.pick button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    var c = document.getElementById('confirm'); if (c) c.disabled = false;
  });
}

/* ---------- night */
var SAY = {
  wolves: ['sayWolvesWake', 'sayWolvesSleep', 'pickWolves', 'wolf'],
  doctor: ['sayDoctorWake', 'sayDoctorSleep', 'pickDoctor', 'doctor'],
  detective: ['sayDetWake', 'sayDetSleep', 'pickDet', 'detective']
};
function renderNight() {
  var steps = nightSteps(), step = steps[G.step], body = '', foot = '';
  if (step === 'close') {
    body = readBlock(t('sayClose'));
    foot = '<button class="btn big accent" id="next">' + esc(t('next')) + '</button>';
  } else if (step === 'dawn') {
    body = readBlock(t('sayMorning'));
    foot = '<button class="btn big accent" id="next">' + esc(t('next')) + '</button>';
  } else {
    var s = SAY[step], roleAlive = aliveRole(s[3]);
    if (G.sub === 'wake') {
      if (roleAlive) {
        body = readBlock(t(s[0])) + noteBlock(t(s[2])) + picker(alive());
        foot = '<button class="btn big accent" id="confirm"' + (ui.pick === null ? ' disabled' : '') + '>' + esc(t('confirm')) + '</button>';
      } else {
        body = readBlock(t(s[0])) + noteBlock(t('roleOut')(roleName(s[3])));
        foot = ui.waitDone
          ? '<button class="btn big accent" id="outNext">' + esc(t('next')) + '</button>'
          : '<button class="btn big accent" id="waitNext" disabled>' + esc(t('wait')(ui.waitLeft || 6)) + '</button>';
      }
    } else if (G.sub === 'answer') {
      var target = G.players[G.picks.detective], wolf = target.role === 'wolf';
      body = '<div class="answer ' + (wolf ? 'yes' : 'no') + '">' + esc(target.name) + ': ' + esc(wolf ? t('isWolf') : t('notWolf')) + '<small>' + esc(wolf ? t('isWolfHow') : t('notWolfHow')) + '</small></div>';
      foot = '<button class="btn big accent" id="next">' + esc(t('next')) + '</button>';
    } else {
      body = readBlock(t(s[1]));
      foot = '<button class="btn big accent" id="next">' + esc(t('next')) + '</button>';
    }
  }
  app.innerHTML = topbar(t('night')(G.round), 'moon') + '<div style="display:grid; gap:16px">' + body + '</div><div class="foot">' + foot + '</div>';
  wireTop(); wirePicker();
  on('#confirm', 'click', function () {
    if (ui.pick === null) return;
    G.picks[step] = ui.pick; ui.pick = null;
    G.sub = (step === 'detective') ? 'answer' : 'sleep';
    save(); render();
  });
  on('#next', 'click', advanceNight);
  on('#outNext', 'click', function () { G.sub = 'sleep'; ui.waitDone = false; ui.waitLeft = 0; save(); render(); });
  if (document.getElementById('waitNext')) startWait();
}
function startWait() {
  if (!ui.waitLeft) ui.waitLeft = 6;
  var btn = document.getElementById('waitNext');
  var iv = setInterval(function () {
    ui.waitLeft--;
    if (!document.body.contains(btn)) { clearInterval(iv); return; }
    if (ui.waitLeft <= 0) { clearInterval(iv); ui.waitLeft = 0; ui.waitDone = true; render(); }
    else { btn.textContent = t('wait')(ui.waitLeft); }
  }, 1000);
}
function advanceNight() {
  var steps = nightSteps(), step = steps[G.step];
  if (step === 'dawn') { resolveNight(); return; }
  if (step === 'close' || G.sub === 'sleep' || G.sub === 'answer') {
    if (G.sub === 'answer') { G.sub = 'sleep'; save(); render(); return; }
    G.step++; G.sub = 'wake'; ui.pick = null; ui.waitLeft = 0; ui.waitDone = false;
    save(); render(); return;
  }
}
function resolveNight() {
  var target = G.picks.wolves, saveIdx = G.picks.doctor;
  G.lastOut = null; G.lastSaved = false;
  if (target !== undefined && target !== null) {
    if (G.settings.doctor && saveIdx === target) G.lastSaved = true;
    else { G.players[target].alive = false; G.lastOut = target; }
  }
  G.phase = 'morning'; G.picks = {}; ui.showRoles = false;
  save(); render();
}

/* ---------- day */
function revealHtml(i) {
  var p = G.players[i];
  if (!G.settings.reveal) return '';
  return '<div class="reveal">' + ico(p.role) + '<div><div class="hint">' + esc(t('wasRole')(p.name, roleName(p.role))) + '</div><b style="color:' + ROLE_COLOR[p.role] + '">' + esc(roleName(p.role)) + '</b></div></div>';
}
function renderMorning() {
  var text = G.lastOut !== null ? t('killed')(G.players[G.lastOut].name) : t('saved');
  app.innerHTML = topbar(t('day')(G.round), 'sun') + '<div style="display:grid; gap:16px">' + readBlock(text) + (G.lastOut !== null ? revealHtml(G.lastOut) : '') + '</div>' +
    '<div class="foot"><button class="btn big accent" id="next">' + esc(t('next')) + '</button></div>';
  wireTop();
  on('#next', 'click', function () {
    var w = checkWin(); if (w) { G.winner = w; G.phase = 'over'; save(); render(); return; }
    G.phase = 'discuss'; G.timerLeft = 180; save(); render();
  });
}
var tick = null;
function stopTimer(keepRunningFlag) { if (tick) { clearInterval(tick); tick = null; } if (!keepRunningFlag) ui.timerRunning = false; }
function fmt(s) { s = Math.max(0, s); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
function beep() {
  try { var a = new (window.AudioContext || window.webkitAudioContext)(); [0, .25, .5].forEach(function (d) { var o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.25, a.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + d + .2); o.start(a.currentTime + d); o.stop(a.currentTime + d + .22); }); } catch (e) {}
  if (navigator.vibrate) { try { navigator.vibrate([200, 100, 200]); } catch (e) {} }
}
function renderDiscuss() {
  app.innerHTML = topbar(t('day')(G.round), 'sun') +
    '<div style="display:grid; gap:16px">' + readBlock(t('discuss')) + noteBlock(t('discussNote')) +
    '<div class="timer' + (G.timerLeft <= 0 ? ' done' : '') + '" id="clock">' + fmt(G.timerLeft) + '</div>' +
    '<div class="row" style="justify-content:center"><button class="btn" id="tGo">' + esc(t('startTimer')) + '</button><button class="btn ghost" id="tPlus">' + esc(t('plusMin')) + '</button></div></div>' +
    '<div class="foot"><button class="btn big accent" id="toVote">' + esc(t('toVote')) + '</button></div>';
  wireTop();
  var clock = document.getElementById('clock'), go = document.getElementById('tGo');
  function paint() { clock.textContent = fmt(G.timerLeft); clock.classList.toggle('done', G.timerLeft <= 0); go.textContent = ui.timerRunning ? t('pause') : t('startTimer'); }
  go.addEventListener('click', function () {
    if (ui.timerRunning) { stopTimer(); paint(); save(); return; }
    if (G.timerLeft <= 0) G.timerLeft = 60;
    ui.timerRunning = true; paint();
    tick = setInterval(function () {
      G.timerLeft--; paint();
      if (G.timerLeft <= 0) { stopTimer(); paint(); beep(); }
      save();
    }, 1000);
  });
  on('#tPlus', 'click', function () { G.timerLeft += 60; paint(); save(); });
  on('#toVote', 'click', function () { stopTimer(); G.phase = 'vote'; ui.pick = null; save(); render(); });
}
function renderVote() {
  app.innerHTML = topbar(t('day')(G.round), 'sun') +
    '<div style="display:grid; gap:16px">' + readBlock(t('voteSay')) + noteBlock(t('voteNote')) +
    picker(alive(), '<button type="button" data-i="none" aria-pressed="' + (ui.pick === -1) + '">' + esc(t('noOne')) + '</button>') + '</div>' +
    '<div class="foot"><button class="btn big danger" id="confirm"' + (ui.pick === null ? ' disabled' : '') + '>' + esc(t('confirm')) + '</button></div>';
  wireTop(); wirePicker();
  on('#confirm', 'click', function () {
    if (ui.pick === null) return;
    G.voteOut = ui.pick >= 0 ? ui.pick : null;
    if (G.voteOut !== null) G.players[G.voteOut].alive = false;
    ui.pick = null; G.phase = 'voted'; save(); render();
  });
}
function renderVoted() {
  var text = G.voteOut !== null ? t('votedOut')(G.players[G.voteOut].name) : t('noVote');
  app.innerHTML = topbar(t('day')(G.round), 'sun') + '<div style="display:grid; gap:16px">' + readBlock(text) + (G.voteOut !== null ? revealHtml(G.voteOut) : '') + '</div>' +
    '<div class="foot"><button class="btn big accent" id="next">' + esc(t('toNight')) + '</button></div>';
  wireTop();
  var w = checkWin();
  if (w) { document.getElementById('next').textContent = t('next'); }
  on('#next', 'click', function () {
    var win = checkWin(); if (win) { G.winner = win; G.phase = 'over'; save(); render(); return; }
    G.round++; G.phase = 'night'; G.step = 0; G.sub = 'wake'; G.picks = {}; save(); render();
  });
}

/* ---------- game over */
function renderOver() {
  var wolvesWon = G.winner === 'wolves';
  var list = G.players.map(function (p) {
    return '<div class="' + (p.alive ? '' : 'out') + '">' + ico(p.role) + '<span style="flex:1">' + esc(p.name) + '</span><b style="color:' + ROLE_COLOR[p.role] + '">' + esc(roleName(p.role)) + '</b></div>';
  }).join('');
  app.innerHTML =
    '<div class="center" style="flex:none; padding-top:20px">' + ico(wolvesWon ? 'wolf' : 'civilian', 'lg') +
      '<div class="win" style="color:' + (wolvesWon ? 'var(--wolf)' : 'var(--gold)') + '">' + esc(wolvesWon ? t('wolvesWin') : t('villageWins')) + '</div></div>' +
    '<section class="panel"><h2 class="label">' + esc(t('allRoles')) + '</h2><div class="roles-list">' + list + '</div></section>' +
    '<div class="foot"><button class="btn big accent" id="again">' + esc(t('again')) + '</button><button class="btn big ghost" id="change">' + esc(t('newGame')) + '</button></div>';
  drop('game');
  on('#again', 'click', function () { newGame(); render(); window.scrollTo(0, 0); });
  on('#change', 'click', function () { G = null; render(); window.scrollTo(0, 0); });
}

render();
})();
</script>
</body>
</html>
